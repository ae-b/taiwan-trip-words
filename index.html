<title>台湾旅行フレーズ帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#FAF6EC;
    --surface:#FFFDF8;
    --surface-alt:#F1E9D8;
    --ink:#262A1F;
    --ink-soft:#7A755F;
    --accent:#C8433A;
    --accent-ink:#FFF8F5;
    --jade:#1D7A67;
    --jade-soft:#E3EFE9;
    --gold:#B98A2E;
    --border:#E4D9C2;
    --shadow: 38 32 20;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15170F;
      --surface:#1F2118;
      --surface-alt:#262819;
      --ink:#F2ECDD;
      --ink-soft:#A9A288;
      --accent:#E8685D;
      --accent-ink:#241009;
      --jade:#3FA88F;
      --jade-soft:#1E332C;
      --gold:#D8AC5C;
      --border:#35372A;
      --shadow: 0 0 0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15170F;
    --surface:#1F2118;
    --surface-alt:#262819;
    --ink:#F2ECDD;
    --ink-soft:#A9A288;
    --accent:#E8685D;
    --accent-ink:#241009;
    --jade:#3FA88F;
    --jade-soft:#1E332C;
    --gold:#D8AC5C;
    --border:#35372A;
    --shadow: 0 0 0;
  }

  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', 'Hiragino Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  button{font-family:inherit;}

  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    padding-inline:16px;
    gap:10px;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding-top:14px;
    flex:0 0 auto;
  }
  .brand-title{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:clamp(1.05rem, 4.2vw, 1.3rem);
    margin:0;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  .lang-switch{
    display:flex;
    border:1px solid var(--border);
    border-radius:999px;
    padding:2px;
    background:var(--surface);
    flex:0 0 auto;
  }
  .lang-switch button{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:.72rem;
    font-weight:600;
    padding:5px 9px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .lang-switch button.active{
    background:var(--accent);
    color:var(--accent-ink);
  }

  /* ---------- progress ---------- */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }
  .progress-track{
    flex:1 1 auto;
    height:6px;
    border-radius:999px;
    background:var(--surface-alt);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--jade), var(--gold));
    border-radius:999px;
    transition:width .35s ease;
  }
  .progress-count{
    font-family:'JetBrains Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-size:.72rem;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  .kana-note{
    margin:-4px 0 0;
    font-size:.66rem;
    color:var(--ink-soft);
    opacity:.75;
    flex:0 0 auto;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:0 0 auto;
  }
  .chip-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:5px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    padding:6px 11px;
    border-radius:999px;
    font-size:.76rem;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip svg{width:14px;height:14px;flex:0 0 auto;}
  .chip.active{
    background:var(--jade-soft);
    border-color:var(--jade);
    color:var(--jade);
    font-weight:700;
  }
  .second-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .status-filter{
    display:flex;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    flex:0 0 auto;
  }
  .status-filter button{
    border:none;
    background:var(--surface);
    color:var(--ink-soft);
    font-size:.72rem;
    font-weight:600;
    padding:6px 9px;
    cursor:pointer;
    border-right:1px solid var(--border);
  }
  .status-filter button:last-child{border-right:none;}
  .status-filter button.active{
    background:var(--accent);
    color:var(--accent-ink);
  }
  .search-wrap{
    flex:1 1 auto;
    position:relative;
    min-width:0;
  }
  .search-wrap input{
    width:100%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:10px;
    padding:7px 10px;
    font-size:.8rem;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--jade);}

  /* ---------- stage ---------- */
  .stage{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .nav-btn{
    flex:0 0 auto;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
  }
  .card-wrap{
    flex:1 1 auto;
    min-width:0;
    height:100%;
    max-height:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .deck-index{
    font-family:'JetBrains Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-size:.7rem;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  #cardHost{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:340px;
    max-height:340px;
  }
  .flashcard{
    position:relative;
    width:100%;
    height:100%;
    perspective:1400px;
    cursor:pointer;
  }
  .flashcard-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .5s cubic-bezier(.2,.7,.3,1);
    transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:10px;
    padding:26px 22px;
    border-radius:18px;
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:0 10px 24px rgba(var(--shadow) / .12);
    backface-visibility:hidden;
    overflow:hidden;
  }
  .face-front::before{
    content:"";
    position:absolute;
    left:14px; top:14px; bottom:14px;
    width:0;
    border-left:2px dashed var(--border);
  }
  .face-front::after{
    content:"";
    position:absolute;
    left:9px; top:36px;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--border);
    box-shadow:0 60px 0 var(--bg), 0 60px 0 1px var(--border),
               0 120px 0 var(--bg), 0 120px 0 1px var(--border),
               0 180px 0 var(--bg), 0 180px 0 1px var(--border);
  }
  .face-back{transform:rotateY(180deg);}
  .cat-tag{
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--jade);
    background:var(--jade-soft);
    padding:3px 9px;
    border-radius:999px;
  }
  .main-text{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:clamp(1.5rem, 7vw, 2.1rem);
    line-height:1.25;
    text-wrap:balance;
  }
  .pinyin{
    font-family:'JetBrains Mono', monospace;
    font-size:.85rem;
    color:var(--ink-soft);
    min-height:1.1em;
  }
  .pinyin .kana{
    font-family:'Noto Sans TC', 'Hiragino Sans', sans-serif;
    font-size:.85rem;
    font-weight:600;
    color:var(--gold);
  }
  .speak-btn{
    border:none;
    background:var(--surface-alt);
    color:var(--ink);
    width:36px;height:36px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .speak-btn svg{width:16px;height:16px;}
  .hint{
    position:absolute;
    bottom:10px;
    font-size:.66rem;
    color:var(--ink-soft);
    opacity:.7;
  }
  .back-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    width:100%;
  }
  .back-row + .back-row{
    border-top:1px solid var(--border);
    padding-top:10px;
  }
  .back-lang-label{
    font-size:.64rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .back-text{
    font-family:'Noto Serif TC', serif;
    font-weight:600;
    font-size:clamp(1rem, 4.6vw, 1.25rem);
  }
  .back-actions{display:flex;align-items:center;gap:8px;}
  .back-actions .speak-btn{width:28px;height:28px;}
  .back-actions .speak-btn svg{width:13px;height:13px;}

  .stamp{
    position:absolute;
    top:14px; right:14px;
    width:64px;height:64px;
    border:3px solid var(--accent);
    color:var(--accent);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-weight:700;
    font-size:.62rem;
    letter-spacing:.03em;
    transform:rotate(-18deg) scale(0);
    opacity:0;
    pointer-events:none;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1), opacity .25s ease;
    backface-visibility:hidden;
  }
  .stamp.show{transform:rotate(-18deg) scale(1);opacity:.92;}
  @media (prefers-reduced-motion: reduce){
    .flashcard-inner, .stamp{transition:none;}
  }

  .empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    color:var(--ink-soft);
    text-align:center;
    padding:20px;
  }
  .empty-state button{
    border:1px solid var(--jade);
    background:var(--jade-soft);
    color:var(--jade);
    font-weight:700;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
  }

  /* ---------- action bar ---------- */
  .action-bar{
    flex:0 0 auto;
    display:flex;
    gap:10px;
    padding-block:12px;
  }
  .action-btn{
    flex:1 1 0;
    border:none;
    border-radius:14px;
    padding:14px 10px;
    font-size:.92rem;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .action-btn.review{
    background:var(--surface-alt);
    color:var(--ink);
    border:1px solid var(--border);
  }
  .action-btn.got-it{
    background:var(--jade);
    color:#FFFFFF;
  }
  .action-btn:active{transform:scale(.97);}

  @media (max-width:380px){
    .nav-btn{display:none;}
  }
</style>

<div id="app">
  <header class="topbar">
    <h1 class="brand-title" id="brandTitle">台湾旅行フレーズ帳</h1>
    <div class="lang-switch" role="group" aria-label="Display language">
      <button data-lang="ja">日本語</button>
      <button data-lang="zh">中文</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-count" id="progressCount">0/0</span>
  </div>
  <p class="kana-note" id="kanaNote"></p>

  <div class="toolbar">
    <div class="chip-row" id="categoryChips"></div>
    <div class="second-row">
      <div class="status-filter" id="statusFilter">
        <button data-status="all"></button>
        <button data-status="unlearned"></button>
        <button data-status="learned"></button>
      </div>
      <div class="search-wrap">
        <input type="search" id="searchInput" autocomplete="off">
      </div>
    </div>
  </div>

  <main class="stage">
    <button class="nav-btn" id="prevBtn" aria-label="Previous">&#8249;</button>
    <div class="card-wrap">
      <div class="deck-index" id="deckIndex">1 / 1</div>
      <div id="cardHost"></div>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="Next">&#8250;</button>
  </main>

  <footer class="action-bar">
    <button class="action-btn review" id="reviewBtn"></button>
    <button class="action-btn got-it" id="gotItBtn"></button>
  </footer>
</div>

  }

  var deck = [];

  function normalize(s){ return (s||"").toLowerCase(); }

  function computeDeck(){
    var q = normalize(state.query.trim());
    deck = WORDS.filter(function(w){
      if (state.category !== "all" && w.cat !== state.category) return false;
      var isLearned = !!state.learned[w.id];
      if (state.status === "learned" && !isLearned) return false;
      if (state.status === "unlearned" && isLearned) return false;
      if (q){
        var hay = normalize(w.zh + " " + w.py + " " + w.ja + " " + w.en);
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    if (state.index >= deck.length) state.index = 0;
    if (state.index < 0) state.index = 0;
  }

  var els = {};
  ["categoryChips","statusFilter","searchInput","cardHost","deckIndex",

  function renderChrome(){
    var t = STR[state.lang];
    document.title = t.title;
    els.brandTitle.textContent = t.title;
    document.querySelectorAll(".lang-switch button").forEach(function(b){
      b.classList.toggle("active", b.dataset.lang === state.lang);
    });

    els.categoryChips.innerHTML = ['<button class="chip'+(state.category==="all"?" active":"")+'" data-cat="all">'+
        (state.lang==="ja"?"すべて":state.lang==="zh"?"全部":"All")+'</button>']
      .concat(CATEGORIES.map(function(c){
        return '<button class="chip'+(state.category===c.id?" active":"")+'" data-cat="'+c.id+'">'+
          ICONS[c.icon] + '<span>' + c[state.lang] + '</span></button>';
      })).join("");

    els.statusFilter.innerHTML =
      '<button data-status="all" class="'+(state.status==="all"?"active":"")+'">'+t.statusAll+'</button>'+
      '<button data-status="unlearned" class="'+(state.status==="unlearned"?"active":"")+'">'+t.statusUnlearned+'</button>'+
      '<button data-status="learned" class="'+(state.status==="learned"?"active":"")+'">'+t.statusLearned+'</button>';

    els.searchInput.placeholder = t.searchPh;
    els.reviewBtn.textContent = t.review;
    els.gotItBtn.textContent = t.gotIt;
    els.kanaNote.textContent = t.kanaNote;

  function escapeAttr(s){
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }

  function langCode(l){
    return l==="zh" ? "zh-TW" : l==="ja" ? "ja-JP" : "en-US";
  }

  function speakBtnHtml(text, lang, size){
    return '<button class="speak-btn" data-action="speak" data-text="'+escapeAttr(text)+'" data-code="'+langCode(lang)+'" aria-label="play">'+SPEAK_ICON+'</button>';
  }

  function pinyinHtml(w){
    return w.py + ' <span class="kana">・' + w.kana + '</span>';
  }

  function renderCard(){
    var t = STR[state.lang];

    if (!deck.length){
      els.deckIndex.textContent = "0 / 0";
      els.cardHost.innerHTML =
        '<div class="empty-state" style="width:280px;max-width:100%;">'+
          '<strong>'+t.emptyTitle+'</strong>'+
          '<span>'+t.emptyBody+'</span>'+
          '<button id="resetFiltersBtn">'+t.resetFilters+'</button>'+
        '</div>';
      var rb = document.getElementById("resetFiltersBtn");
      if (rb) rb.addEventListener("click", function(){
        state.category = "all"; state.status = "all"; state.query = "";
        els.searchInput.value = "";
        computeDeck(); renderChrome(); renderCard(); updateProgress();
      });
      return;
    }

    var w = deck[state.index];
    var cat = CATEGORIES.filter(function(c){ return c.id === w.cat; })[0];
    els.deckIndex.textContent = (state.index+1) + " / " + deck.length;

    var order = ["ja","zh","en"].filter(function(l){ return l !== state.lang; });

    var frontText = w[state.lang];
    var frontPinyin = state.lang === "zh" ? pinyinHtml(w) : "";

    var backRows = order.map(function(l){
      var text = w[l];
      var pinyin = l === "zh" ? '<div class="pinyin">'+pinyinHtml(w)+'</div>' : "";
      return '<div class="back-row">'+
          '<span class="back-lang-label">'+t.langNames[l]+'</span>'+
          '<span class="back-text">'+text+'</span>'+
          pinyin+
          '<div class="back-actions">'+speakBtnHtml(text, l)+'</div>'+
        '</div>';
    }).join("");

    els.cardHost.innerHTML =
      '<div class="flashcard'+(state.flipped?" flipped":"")+'" id="flashcard">'+
        '<div class="flashcard-inner">'+
          '<div class="face face-front">'+
            '<span class="cat-tag">'+(cat ? cat[state.lang] : "")+'</span>'+
            '<div class="main-text">'+frontText+'</div>'+
            (frontPinyin ? '<div class="pinyin">'+frontPinyin+'</div>' : '<div class="pinyin"></div>')+
            speakBtnHtml(frontText, state.lang)+
            '<span class="hint">'+t.hint+'</span>'+
          '</div>'+
          '<div class="face face-back">'+
            backRows+
          '</div>'+
        '</div>'+
        '<div class="stamp" id="stampMark">'+t.stamp+'</div>'+
      '</div>';

    bindCardEvents();
  }

  function updateProgress(){
    var total = WORDS.length;
    var learnedCount = WORDS.filter(function(w){ return !!state.learned[w.id]; }).length;
    els.progressFill.style.width = (total ? (learnedCount/total*100) : 0) + "%";
    els.progressCount.textContent = learnedCount + "/" + total;
  }

  var touchStartX=0, touchStartY=0, swiped=false;

  function bindCardEvents(){
    var card = document.getElementById("flashcard");
    if (!card) return;

    card.addEventListener("click", function(e){
      if (swiped){ swiped = false; return; }
      var speakBtn = e.target.closest && e.target.closest('[data-action="speak"]');
      if (speakBtn){
        e.stopPropagation();
        speak(speakBtn.dataset.text, speakBtn.dataset.code);
        return;
      }
      state.flipped = !state.flipped;
      card.classList.toggle("flipped", state.flipped);
    });

    card.addEventListener("touchstart", function(e){
      var t = e.changedTouches[0];
      touchStartX = t.clientX; touchStartY = t.clientY;
    }, {passive:true});

    card.addEventListener("touchend", function(e){
      var t = e.changedTouches[0];
      var dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dy) < 60){
        swiped = true;
        dx < 0 ? goNext() : goPrev();
      }
    }, {passive:true});
  }

  function speak(text, code){
    if (!("speechSynthesis" in window)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = code;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function goNext(){
    if (!deck.length) return;
    state.index = (state.index + 1) % deck.length;
    state.flipped = false;
    renderCard();
  }
  function goPrev(){
    if (!deck.length) return;
    state.index = (state.index - 1 + deck.length) % deck.length;
    state.flipped = false;
    renderCard();
  }

  function mark(isLearned){
    if (!deck.length) return;
    var w = deck[state.index];
    state.learned[w.id] = isLearned;
    saveProgress();
    updateProgress();

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (isLearned){
      var stamp = document.getElementById("stampMark");
      if (stamp) stamp.classList.add("show");
      setTimeout(advanceAfterMark, reduceMotion ? 120 : 480);
    } else {
      advanceAfterMark();
    }
  }

  function advanceAfterMark(){
    var currentId = deck[state.index] ? deck[state.index].id : null;
    computeDeck();
    var pos = currentId ? deck.findIndex(function(w){ return w.id === currentId; }) : -1;
    if (!deck.length){
      state.index = 0;
    } else if (pos >= 0){
      state.index = (pos + 1) % deck.length;
    } else {
      state.index = Math.min(state.index, deck.length - 1);
    }
    state.flipped = false;
    renderCard();
  }

  els.categoryChips.addEventListener("click", function(e){
    var btn = e.target.closest("[data-cat]");
    if (!btn) return;
    state.category = btn.dataset.cat;
    state.index = 0; state.flipped = false;
    computeDeck(); renderChrome(); renderCard();
  });

  els.statusFilter.addEventListener("click", function(e){
    var btn = e.target.closest("[data-status]");
    if (!btn) return;
    state.status = btn.dataset.status;
    state.index = 0; state.flipped = false;
    computeDeck(); renderChrome(); renderCard();
  });

  els.searchInput.addEventListener("input", function(e){
    state.query = e.target.value;
    state.index = 0; state.flipped = false;
    computeDeck(); renderCard();
  });

  document.querySelectorAll(".lang-switch button").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.lang = btn.dataset.lang;
      state.flipped = false;
      savePrefs();
      renderChrome(); renderCard();
    });
  });

  els.prevBtn.addEventListener("click", goPrev);
  els.nextBtn.addEventListener("click", goNext);
  els.reviewBtn.addEventListener("click", function(){ mark(false); });
  els.gotItBtn.addEventListener("click", function(){ mark(true); });

  function start(){
    computeDeck();
    renderChrome();
    renderCard();
    updateProgress();
  }

  if (window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(start) : start();
  } else {
    start();
  }
})();
</script>
